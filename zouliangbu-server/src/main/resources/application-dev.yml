# dev：SQLite 单文件库（零依赖、免装 DB、重启数据不丢）。
# 路径可用 SQLITE_PATH 覆盖；默认落在启动目录下的 zlb-dev.db（不依赖子目录，jar 拷到哪都能起）。
# 连接池必须 1：SQLite 同一时刻只允许一个写者，多连接会 SQLITE_BUSY。
spring:
  datasource:
    url: jdbc:sqlite:${SQLITE_PATH:zlb-dev.db}
    driver-class-name: org.sqlite.JDBC
    username: ""
    password: ""
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
      connection-init-sql: PRAGMA busy_timeout = 5000
  flyway:
    locations: classpath:db/migration/sqlite,classpath:db/migration/common

# 气象代理（天气系统第 2 项）：和风 Key 通过环境变量注入，默认留空回退纯 Open-Meteo。
# 生产请用 QWEATHER_KEY 环境变量覆盖，不要把 Key 提交进仓库。
zlb:
  weather:
    qweather-key: ${QWEATHER_KEY:82248aea8f5d4dfea275947410a26285}
    cache-ttl-sec: 600
    nowcast-cache-ttl-sec: 300
