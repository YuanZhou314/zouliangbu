# dev：SQLite 单文件库（零依赖、免装 DB、重启数据不丢）。
# 路径可用 SQLITE_PATH 覆盖；默认落在启动目录下的 zlb-dev.db（不依赖子目录，jar 拷到哪都能起）。
# 连接池必须 1：SQLite 同一时刻只允许一个写者，多连接会 SQLITE_BUSY。
spring:
  datasource:
    url: jdbc:sqlite:${SQLITE_PATH:zlb-dev.db}
    driver-class-name: org.sqlite.JDBC
    username: ""
    password: ""
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
      connection-init-sql: PRAGMA busy_timeout = 5000
  flyway:
    locations: classpath:db/migration/sqlite,classpath:db/migration/common

# 气象代理（天气系统第 2 项）：和风走 JWT 认证，凭据通过环境变量注入。
# 本地开发默认填好（私钥仅用于开发，与控制台上传的公钥成对）；生产用 zlb.env 覆盖。
zlb:
  weather:
    qweather-host: ${QWEATHER_HOST:https://api.qweather.com/v7}
    qweather-project-id: ${QWEATHER_PROJECT_ID:}
    qweather-credential-id: ${QWEATHER_CREDENTIAL_ID:}
    qweather-dev-id: ${QWEATHER_DEV_ID:}
    qweather-private-key: ${QWEATHER_PRIVATE_KEY:}
    cache-ttl-sec: 600
    nowcast-cache-ttl-sec: 300
