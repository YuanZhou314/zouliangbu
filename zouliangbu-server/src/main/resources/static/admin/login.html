<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>走两步 · 管理后台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f5;color:#333;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,0.1);padding:40px;width:360px;text-align:center}
h1{font-size:20px;margin-bottom:8px}
p{font-size:13px;color:#888;margin-bottom:24px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:15px;margin-bottom:16px;outline:none}
input:focus{border-color:#1B5E20}
button{width:100%;padding:12px;background:#1B5E20;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer}
button:hover{background:#154d18}
.error{color:#d32f2f;font-size:13px;margin-bottom:12px;display:none}
</style>
</head>
<body>
<div class="card">
  <h1>走两步 · 管理后台</h1>
  <p>路线内容审核与管理</p>
  <div class="error" id="error"></div>
  <input type="password" id="password" placeholder="管理员密码" onkeydown="if(event.key==='Enter')doLogin()">
  <button onclick="doLogin()">登录</button>
</div>
<script>
async function doLogin() {
  const pw = document.getElementById('password').value.trim();
  if (!pw) { showError('请输入密码'); return; }
  const errorEl = document.getElementById('error');
  errorEl.style.display = 'none';
  try {
    const resp = await fetch('/api/v1/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    const data = await resp.json();
    if (data.code === 0 && data.data) {
      localStorage.setItem('admin_token', data.data);
      window.location.href = 'index.html';
    } else {
      showError(data.msg || '登录失败');
    }
  } catch (e) {
    showError('网络错误，请确认服务端已启动');
  }
}
function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = 'block';
}
</script>
</body>
</html>
