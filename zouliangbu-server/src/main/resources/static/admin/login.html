<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 走两步管理后台</title>
<link rel="stylesheet" href="app.css">
<style>
body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:#f4f6f4}
.login{background:#fff;border-radius:12px;box-shadow:0 2px 14px rgba(0,0,0,.08);padding:38px 36px;width:360px}
.login h1{font-size:19px;margin-bottom:6px;color:#1B5E20}
.login p{font-size:12.5px;color:#87938a;margin-bottom:24px}
.login input{width:100%;padding:11px 13px;border:1px solid #d8ddd8;border-radius:8px;font-size:14px;
  outline:none;margin-bottom:14px}
.login input:focus{border-color:#1B5E20;box-shadow:0 0 0 2px rgba(27,94,32,.08)}
.login button{width:100%;padding:11px;background:#1B5E20;color:#fff;border:none;border-radius:8px;
  font-size:14.5px;cursor:pointer}
.login button:hover{background:#154a19}
.login button:disabled{opacity:.6;cursor:not-allowed}
.error{color:#c62828;font-size:13px;margin-bottom:12px;display:none}
</style>
</head>
<body>
<div class="login">
  <h1>走两步 · 管理后台</h1>
  <p>内容运营 / 路线审核 / 系统配置</p>
  <div class="error" id="error"></div>
  <input type="password" id="password" placeholder="管理员密码" autocomplete="current-password"
         onkeydown="if(event.key==='Enter')doLogin()">
  <button id="btnLogin" onclick="doLogin()">登录</button>
</div>
<script>
async function doLogin() {
  const pw = document.getElementById('password').value.trim();
  if (!pw) { showError('请输入密码'); return; }
  const errorEl = document.getElementById('error');
  errorEl.style.display = 'none';
  const btn = document.getElementById('btnLogin');
  btn.disabled = true;
  try {
    const resp = await fetch('/api/v1/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    // 密码错误时服务端现在返回 HTTP 400 + code 1001（以前恒返回 200），
    // 所以不能只看 resp.ok，要同时读 body 的 msg 才能显示"密码错误"而不是"网络错误"。
    const data = await resp.json().catch(() => null);
    if (data && data.code === 0 && data.data) {
      localStorage.setItem('admin_token', data.data);
      window.location.href = 'dashboard.html';
    } else {
      showError((data && data.msg) || '登录失败（HTTP ' + resp.status + '）');
    }
  } catch (e) {
    showError('网络错误，请确认服务端已启动');
  } finally {
    btn.disabled = false;
  }
}

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = 'block';
}

// 已登录直接进后台，避免每次都要重新输密码
if (localStorage.getItem('admin_token')) {
  window.location.href = 'dashboard.html';
}
</script>
</body>
</html>
