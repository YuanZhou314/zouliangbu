<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>线路库 · 走两步管理后台</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app"></div>

<!-- 驳回弹窗 -->
<div class="modal-bg" id="rejectModal">
  <div class="modal">
    <h2>驳回提交</h2>
    <div class="field">
      <label class="f">驳回原因（App 侧会展示给提交者）</label>
      <textarea id="rejectReason" rows="3" placeholder="如：链接失效 / 已收录 / 轨迹质量不足"></textarea>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeRejectModal()">取消</button>
      <button class="btn btn-danger" onclick="confirmReject()">确认驳回</button>
    </div>
  </div>
</div>

<script src="layout.js"></script>
<script>
let currentStatus = 'PENDING';
let rejectId = null;

Shell.mount({
  active: 'routes',
  title: '线路库',
  render(body, ctx) {
    ctx.actions.innerHTML = '<a class="btn btn-primary" href="edit.html">+ 新建线路</a>';
    body.innerHTML = `
      <div class="card">
        <div class="toolbar">
          <button class="btn" data-status="PENDING" onclick="switchTab(this)">待审批</button>
          <button class="btn" data-status="APPROVED" onclick="switchTab(this)">已上线</button>
          <button class="btn" data-status="REJECTED" onclick="switchTab(this)">已驳回</button>
          <button class="btn" data-status="" onclick="switchTab(this)">全部</button>
          <div class="spacer"></div>
          <span class="hint" id="summary"></span>
        </div>
        <div id="list"><div class="empty">加载中...</div></div>
      </div>
    `;
    markActive();
    loadList();
  }
});

function statusText(s) {
  return { PENDING: '待审批', APPROVED: '已上线', REJECTED: '已驳回' }[s] || s;
}

function statusBadge(s) {
  const cls = s === 'PENDING' ? 'warn' : (s === 'APPROVED' ? 'on' : 'err');
  return '<span class="badge ' + cls + '">' + Shell.esc(statusText(s)) + '</span>';
}

function markActive() {
  document.querySelectorAll('[data-status]').forEach(b => {
    const on = b.dataset.status === currentStatus;
    b.className = 'btn' + (on ? ' btn-primary' : '');
  });
}

function switchTab(el) {
  currentStatus = el.dataset.status;
  markActive();
  loadList();
}

async function loadList() {
  const el = document.getElementById('list');
  el.innerHTML = '<div class="empty">加载中...</div>';
  const url = '/api/v1/admin/submissions' + (currentStatus ? '?status=' + currentStatus : '');
  let rows;
  try {
    rows = await Shell.api(url);
  } catch (e) {
    el.innerHTML = '<div class="empty">加载失败：' + Shell.esc(e.message) + '</div>';
    return;
  }
  document.getElementById('summary').textContent = '共 ' + rows.length + ' 条';
  if (!rows.length) {
    el.innerHTML = '<div class="empty">该状态下暂无提交</div>';
    return;
  }
  el.innerHTML = rows.map(r => `
    <div style="background:#fff;border-radius:10px;padding:14px 18px;margin-bottom:10px;
                box-shadow:0 1px 3px rgba(0,0,0,.05);display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <div style="flex:1;min-width:220px">
        <div style="font-size:14px;font-weight:500;margin-bottom:4px">
          ${Shell.esc(r.sourceRouteId || r.sourceUrl)} ${statusBadge(r.status)}
        </div>
        <div class="hint">
          提交者：${Shell.esc(r.submitterUuid || '匿名')} ·
          时间：${Shell.esc((r.createdAt || '-').replace('T', ' ').slice(0, 19))}
        </div>
        <div class="hint mono" style="word-break:break-all">${Shell.esc(r.sourceUrl)}</div>
        ${r.submitterNote ? '<div class="hint">备注：' + Shell.esc(r.submitterNote) + '</div>' : ''}
        ${r.rejectReason ? '<div class="hint" style="color:#c62828">驳回原因：' + Shell.esc(r.rejectReason) + '</div>' : ''}
      </div>
      <button class="btn btn-sm" onclick="goToDetail(${r.id})">详情</button>
      ${r.status === 'PENDING' ? `
        <button class="btn btn-sm btn-primary" onclick="approve(${r.id})">通过并抓取</button>
        <button class="btn btn-sm btn-danger" onclick="showRejectModal(${r.id})">驳回</button>
      ` : ''}
      ${r.status === 'APPROVED' && r.routeId ? `
        <button class="btn btn-sm btn-danger" onclick="deleteRoute(${r.routeId})">删除</button>
      ` : ''}
    </div>
  `).join('');
}

async function approve(id) {
  if (!confirm('通过后会自动抓取并入库，确认？')) return;
  Shell.toast('抓取中，请稍候...');
  try {
    await Shell.api('/api/v1/admin/submissions/' + id + '/approve', { method: 'POST' });
    Shell.toast('已通过并抓取入库');
    loadList();
  } catch (e) {
    Shell.toast('失败：' + e.message, false);
  }
}

function showRejectModal(id) {
  rejectId = id;
  document.getElementById('rejectReason').value = '';
  document.getElementById('rejectModal').classList.add('show');
}

function closeRejectModal() {
  rejectId = null;
  document.getElementById('rejectModal').classList.remove('show');
}

async function confirmReject() {
  const reason = document.getElementById('rejectReason').value.trim();
  if (!reason) { Shell.toast('请填驳回原因', false); return; }
  try {
    await Shell.api('/api/v1/admin/submissions/' + rejectId + '/reject', {
      method: 'POST', body: JSON.stringify({ reason: reason })
    });
    Shell.toast('已驳回');
    closeRejectModal();
    loadList();
  } catch (e) {
    Shell.toast(e.message, false);
  }
}

function goToDetail(submissionId) {
  window.location.href = 'edit.html?id=' + submissionId;
}

/** 删除线路（软删 status=0，App 公开接口自动过滤；可用 /publish 恢复）。 */
async function deleteRoute(routeId) {
  if (!confirm('确认删除该线路？App 端将不再展示（可在后台重新上架恢复）。')) return;
  try {
    await Shell.api('/api/v1/admin/routes/' + routeId, { method: 'DELETE' });
    Shell.toast('已删除');
    loadList();
  } catch (e) {
    Shell.toast(e.message, false);
  }
}
</script>
</body>
</html>
