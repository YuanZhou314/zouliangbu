<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>走两步 · 管理后台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f5;color:#333}
.topbar{background:#1B5E20;color:#fff;padding:12px 24px;display:flex;align-items:center;gap:16px}
.topbar h1{font-size:18px;flex:1}
.topbar button{background:rgba(255,255,255,0.15);color:#fff;border:none;padding:6px 16px;border-radius:6px;cursor:pointer;font-size:13px}
.topbar button:hover{background:rgba(255,255,255,0.25)}
.tabs{display:flex;gap:0;border-bottom:2px solid #e0e0e0;background:#fff;padding:0 24px}
.tab{padding:12px 20px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;font-size:14px;color:#666}
.tab.active{color:#1B5E20;border-bottom-color:#1B5E20;font-weight:600}
.content{padding:20px 24px;max-width:1100px;margin:0 auto}
.empty{text-align:center;padding:60px 0;color:#999}
.row{background:#fff;border-radius:10px;padding:16px 20px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,0.06);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.row .info{flex:1;min-width:200px}
.row .info .name{font-size:15px;font-weight:500;margin-bottom:4px}
.row .info .meta{font-size:12px;color:#888}
.row .info .url{font-size:11px;color:#aaa;word-break:break-all;margin-top:2px}
.badge{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:500}
.badge.PENDING{background:#fff3e0;color:#e65100}
.badge.APPROVED{background:#e8f5e9;color:#2e7d32}
.badge.REJECTED{background:#fce4ec;color:#c62828}
.btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:12px}
.btn-approve{background:#2e7d32;color:#fff}
.btn-reject{background:#c62828;color:#fff}
.btn-edit{background:#1565c0;color:#fff}
.btn-approve:hover{background:#1b5e20}
.btn-reject:hover{background:#b71c1c}
.btn-edit:hover{background:#0d47a1}
.btn-ok{background:#2e7d32;color:#fff}
.btn-cancel{background:#757575;color:#fff}
.section-title{font-size:13px;color:#999;margin:16px 0 8px}
input,textarea,select{padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:13px;outline:none;width:100%}
input:focus,textarea:focus{border-color:#1B5E20}
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);display:none;align-items:center;justify-content:center;z-index:100}
.modal{background:#fff;border-radius:12px;padding:24px;width:500px;max-height:80vh;overflow-y:auto}
.modal h2{font-size:16px;margin-bottom:16px}
.modal label{display:block;font-size:12px;color:#666;margin-bottom:4px;margin-top:12px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
</style>
</head>
<body>
<div class="topbar">
  <h1>走两步 · 管理后台</h1>
  <button onclick="goToEdit()">新建路线</button>
  <button onclick="logout()">退出</button>
</div>
<div class="tabs">
  <div class="tab active" data-status="PENDING" onclick="switchTab(this)">待审批</div>
  <div class="tab" data-status="APPROVED" onclick="switchTab(this)">已上线</div>
  <div class="tab" data-status="REJECTED" onclick="switchTab(this)">已驳回</div>
  <div class="tab" data-status="" onclick="switchTab(this)">全部</div>
</div>
<div class="content" id="list">
  <div class="empty">加载中...</div>
</div>

<!-- 驳回弹窗 -->
<div class="modal-bg" id="rejectModal">
  <div class="modal">
    <h2>驳回提交</h2>
    <label>驳回原因</label>
    <textarea id="rejectReason" rows="3" placeholder="请输入驳回原因"></textarea>
    <div class="actions">
      <button class="btn btn-cancel" onclick="closeRejectModal()">取消</button>
      <button class="btn btn-reject" onclick="confirmReject()">确认驳回</button>
    </div>
  </div>
</div>

<script>
let currentStatus = 'PENDING';
let rejectId = null;

function getToken() {
  return localStorage.getItem('admin_token') || '';
}

function api(path, opts = {}) {
  opts.headers = opts.headers || {};
  opts.headers['X-Admin-Token'] = getToken();
  return fetch(path, opts);
}

async function loadList() {
  const el = document.getElementById('list');
  el.innerHTML = '<div class="empty">加载中...</div>';
  try {
    const url = '/api/v1/admin/submissions' + (currentStatus ? '?status=' + currentStatus : '');
    const resp = await api(url);
    const data = await resp.json();
    if (data.code === 401 || resp.status === 401) {
      window.location.href = 'login.html';
      return;
    }
    const rows = data.data || [];
    if (rows.length === 0) {
      el.innerHTML = '<div class="empty">暂无数据</div>';
      return;
    }
    el.innerHTML = rows.map(r => `
      <div class="row">
        <div class="info">
          <div class="name">${r.sourceRouteId || r.sourceUrl}</div>
          <div class="meta">
            提交者：${r.submitterUuid || '匿名'} ·
            时间：${r.createdAt || '-'} ·
            <span class="badge ${r.status}">${statusText(r.status)}</span>
          </div>
          <div class="url">${r.sourceUrl}</div>
          ${r.submitterNote ? '<div class="meta" style="margin-top:4px">备注：' + r.submitterNote + '</div>' : ''}
          ${r.rejectReason ? '<div class="meta" style="color:#c62828;margin-top:4px">驳回原因：' + r.rejectReason + '</div>' : ''}
        </div>
        ${r.status === 'PENDING' ? `
          <button class="btn btn-approve" onclick="approve(${r.id})">通过</button>
          <button class="btn btn-reject" onclick="showRejectModal(${r.id})">驳回</button>
        ` : ''}
        ${r.status === 'APPROVED' && r.routeId ? `
          <button class="btn btn-edit" onclick="goToEdit(${r.routeId})">编辑</button>
        ` : ''}
      </div>
    `).join('');
  } catch (e) {
    el.innerHTML = '<div class="empty">网络错误</div>';
  }
}

function statusText(s) {
  return { PENDING: '待审批', APPROVED: '已上线', REJECTED: '已驳回' }[s] || s;
}

function switchTab(el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  currentStatus = el.dataset.status;
  loadList();
}

async function approve(id) {
  if (!confirm('确认通过并抓取？')) return;
  const resp = await api(`/api/v1/admin/submissions/${id}/approve`, { method: 'POST' });
  const data = await resp.json();
  if (data.code === 0) {
    alert('通过并抓取成功');
    loadList();
  } else {
    alert('失败：' + (data.msg || '未知错误'));
  }
}

function showRejectModal(id) {
  rejectId = id;
  document.getElementById('rejectReason').value = '';
  document.getElementById('rejectModal').style.display = 'flex';
}

function closeRejectModal() {
  rejectId = null;
  document.getElementById('rejectModal').style.display = 'none';
}

async function confirmReject() {
  const reason = document.getElementById('rejectReason').value.trim();
  if (!reason) { alert('请输入驳回原因'); return; }
  const resp = await api(`/api/v1/admin/submissions/${rejectId}/reject`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ reason })
  });
  const data = await resp.json();
  closeRejectModal();
  loadList();
}

function goToEdit(routeId) {
  if (routeId) {
    window.location.href = 'edit.html?id=' + routeId;
  } else {
    window.location.href = 'edit.html';
  }
}

function logout() {
  api('/api/v1/admin/logout', { method: 'POST' }).catch(() => {});
  localStorage.removeItem('admin_token');
  window.location.href = 'login.html';
}

loadList();
</script>
</body>
</html>
