<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>操作审计 · 走两步管理后台</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app"></div>
<script src="layout.js"></script>
<script>
let page = 1;
let size = 30;
const PAGE_SIZE = 30;

Shell.mount({
  active: 'audit',
  title: '操作审计',
  render(body) {
    body.innerHTML = `
      <div class="card">
        <div class="toolbar">
          <select id="q-action" style="width:170px">
            <option value="">全部动作</option>
            <option value="gear.">装备分类</option>
            <option value="section.">线路分组</option>
            <option value="config.">配置中心</option>
          </select>
          <button class="btn" onclick="reload()">查询</button>
          <div class="spacer"></div>
          <span class="hint" id="summary"></span>
        </div>
        <div id="tableWrap"><div class="empty">加载中...</div></div>
        <div class="toolbar" style="margin-top:14px;margin-bottom:0;justify-content:flex-end">
          <button class="btn" id="btnPrev" onclick="prev()">上一页</button>
          <span class="hint" id="pageInfo" style="padding:0 6px"></span>
          <button class="btn" id="btnNext" onclick="next()">下一页</button>
        </div>
      </div>
    `;
    load();
  }
});

function reload() {
  page = 1;
  load();
}

async function load() {
  const wrap = document.getElementById('tableWrap');
  wrap.innerHTML = '<div class="empty">加载中...</div>';
  const action = document.getElementById('q-action').value;
  const qs = ['page=' + page, 'size=' + PAGE_SIZE];
  if (action) qs.push('action=' + encodeURIComponent(action));
  let d;
  try {
    d = await Shell.api('/api/v1/admin/audit?' + qs.join('&'));
  } catch (e) {
    wrap.innerHTML = '<div class="empty">加载失败：' + Shell.esc(e.message) + '</div>';
    return;
  }
  const items = d.items || [];
  const totalPages = Math.max(1, Math.ceil(d.total / d.size));
  document.getElementById('summary').textContent = '共 ' + d.total + ' 条';
  document.getElementById('pageInfo').textContent = '第 ' + d.page + ' / ' + totalPages + ' 页';
  document.getElementById('btnPrev').disabled = d.page <= 1;
  document.getElementById('btnNext').disabled = d.page >= totalPages;

  if (!items.length) {
    wrap.innerHTML = '<div class="empty">暂无操作记录</div>';
    return;
  }
  wrap.innerHTML = `
    <table>
      <thead><tr>
        <th style="width:150px">时间</th>
        <th style="width:80px">操作人</th>
        <th style="width:130px">动作</th>
        <th style="width:110px">对象</th>
        <th>内容</th>
        <th style="width:110px">IP</th>
      </tr></thead>
      <tbody>
        ${items.map(a => `
          <tr>
            <td class="mono">${Shell.esc((a.createdAt || '').replace('T', ' ').slice(0, 19))}</td>
            <td>${Shell.esc(a.operator)}</td>
            <td><span class="badge off">${Shell.esc(a.action)}</span></td>
            <td class="mono">${Shell.esc((a.targetType || '') + (a.targetId ? ' #' + a.targetId : ''))}</td>
            <td class="wrap">${Shell.esc(a.detail || '')}</td>
            <td class="mono">${Shell.esc(a.ip || '')}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function prev() { if (page > 1) { page--; load(); } }
function next() { page++; load(); }
</script>
</body>
</html>
