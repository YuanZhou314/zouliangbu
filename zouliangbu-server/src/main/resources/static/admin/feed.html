<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首页动态 · 走两步管理后台</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app"></div>

<!-- 编辑弹窗 -->
<div class="modal-bg" id="editModal">
  <div class="modal">
    <h2 id="modalTitle">新增动态</h2>
    <div class="field">
      <label class="f">标题（必填，≤120 字）</label>
      <input type="text" id="f-title" maxlength="120" placeholder="如：武功山反穿：两天一夜看云海日出全记录">
    </div>
    <div class="field" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div>
        <label class="f">作者（必填，≤40 字）</label>
        <input type="text" id="f-author" maxlength="40" placeholder="如山野拾光">
      </div>
      <div>
        <label class="f">城市（必填）</label>
        <input type="text" id="f-city" maxlength="32" placeholder="如 萍乡（App 首页按城市筛）">
      </div>
    </div>
    <div class="field" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div>
        <label class="f">点赞数</label>
        <input type="number" id="f-likeCount" min="0" placeholder="0">
      </div>
      <div>
        <label class="f">封面比例（0.5–2.0）</label>
        <input type="number" id="f-coverAspectRatio" step="0.05" min="0.5" max="2" placeholder="1.0">
      </div>
    </div>
    <div class="field">
      <label class="f">封面图</label>
      <div style="display:flex;gap:10px;align-items:center">
        <input type="text" id="f-coverUrl" placeholder="点右侧上传，或直接填 /uploads/... 地址" style="flex:1">
        <input type="file" id="f-coverFile" accept="image/jpeg,image/png,image/webp" style="display:none">
        <button class="btn" onclick="document.getElementById('f-coverFile').click()">上传</button>
      </div>
      <div class="hint" id="coverHint">支持 jpg / png / webp，≤5MB。上传后自动填入地址。</div>
    </div>
    <div class="field">
      <label class="f">封面图作者（可选，署名）</label>
      <input type="text" id="f-coverAuthor" maxlength="40" placeholder="如 摄影：山野拾光">
    </div>
    <div class="field">
      <label class="f">正文（可选）</label>
      <textarea id="f-content" rows="6" placeholder="动态正文，App 详情页使用"></textarea>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="btnSave" onclick="save()">保存</button>
    </div>
  </div>
</div>

<script src="layout.js"></script>
<script>
let rows = [];
let editingId = null;

Shell.mount({
  active: 'feed',
  title: '首页动态',
  render(body, ctx) {
    ctx.actions.innerHTML = '<button class="btn btn-primary" onclick="openModal()">+ 新增动态</button>';

    body.innerHTML = `
      <div class="card">
        <div class="toolbar">
          <input type="text" id="q-city" placeholder="按城市筛选，如 萍乡" style="width:180px">
          <select id="q-status" style="width:130px">
            <option value="">全部状态</option>
            <option value="1">已上线</option>
            <option value="0">已下线</option>
          </select>
          <button class="btn" onclick="load()">查询</button>
          <div class="spacer"></div>
          <span class="hint" id="summary"></span>
        </div>
        <div id="tableWrap"><div class="empty">加载中...</div></div>
      </div>
    `;

    // 上传头像/封面：文件选中后立刻传，避免"保存时才发现图没上去"
    document.getElementById('f-coverFile').onchange = async function () {
      const file = this.files && this.files[0];
      if (!file) return;
      const fd = new FormData();
      fd.append('file', file);
      const hint = document.getElementById('coverHint');
      hint.textContent = '上传中...';
      try {
        const data = await Shell.api('/api/v1/admin/upload', { method: 'POST', body: fd });
        document.getElementById('f-coverUrl').value = data.url;
        hint.textContent = '上传成功：' + data.url + '（' + Math.round(data.size / 1024) + ' KB）';
      } catch (e) {
        hint.textContent = '上传失败：' + e.message;
      }
      this.value = '';
    };

    load();
  }
});

async function load() {
  const wrap = document.getElementById('tableWrap');
  wrap.innerHTML = '<div class="empty">加载中...</div>';
  const city = document.getElementById('q-city').value.trim();
  const status = document.getElementById('q-status').value;
  const qs = [];
  if (city) qs.push('city=' + encodeURIComponent(city));
  if (status !== '') qs.push('status=' + status);
  try {
    rows = await Shell.api('/api/v1/admin/feed' + (qs.length ? '?' + qs.join('&') : ''));
  } catch (e) {
    wrap.innerHTML = '<div class="empty">加载失败：' + Shell.esc(e.message) + '</div>';
    return;
  }
  const online = rows.filter(r => r.status === 1).length;
  const noCover = rows.filter(r => !r.hasCover).length;
  document.getElementById('summary').textContent =
    '共 ' + rows.length + ' 条 · 上线 ' + online + ' · 缺封面 ' + noCover;

  if (!rows.length) {
    wrap.innerHTML = '<div class="empty">没有符合条件的动态</div>';
    return;
  }
  wrap.innerHTML = `
    <table>
      <thead><tr>
        <th style="width:60px">ID</th>
        <th>标题</th>
        <th style="width:100px">作者</th>
        <th style="width:80px">城市</th>
        <th style="width:70px">点赞</th>
        <th style="width:90px">封面</th>
        <th style="width:80px">状态</th>
        <th style="width:130px">操作</th>
      </tr></thead>
      <tbody>
        ${rows.map(r => `
          <tr>
            <td class="mono">${r.id}</td>
            <td class="wrap">${Shell.esc(r.title)}</td>
            <td>${Shell.esc(r.author)}</td>
            <td>${Shell.esc(r.city)}</td>
            <td>${r.likeCount}</td>
            <td>${r.hasCover
              ? '<span class="badge on">有图</span>'
              : '<span class="badge warn">缺图</span>'}</td>
            <td>${r.status === 1
              ? '<span class="badge on">已上线</span>'
              : '<span class="badge off">已下线</span>'}</td>
            <td>
              <button class="btn btn-sm" onclick="openModal(${r.id})">编辑</button>
              <button class="btn btn-sm" onclick="toggle(${r.id}, ${r.status})">
                ${r.status === 1 ? '下线' : '上线'}
              </button>
              <button class="btn btn-sm btn-danger" onclick="remove(${r.id}, ${r.status})">删除</button>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function openModal(id) {
  editingId = id || null;
  document.getElementById('modalTitle').textContent = id ? '编辑动态 #' + id : '新增动态';
  const r = id ? rows.find(x => x.id === id) : null;
  document.getElementById('f-title').value = r ? r.title : '';
  document.getElementById('f-author').value = r ? r.author : '';
  document.getElementById('f-city').value = r ? r.city : '';
  document.getElementById('f-likeCount').value = r ? r.likeCount : 0;
  document.getElementById('f-coverAspectRatio').value = r ? r.coverAspectRatio : 1.0;
  document.getElementById('f-coverUrl').value = r ? (r.coverUrl || '') : '';
  document.getElementById('f-coverAuthor').value = r ? (r.coverAuthor || '') : '';
  document.getElementById('f-content').value = r ? (r.content || '') : '';
  document.getElementById('coverHint').textContent = '支持 jpg / png / webp，≤5MB。上传后自动填入地址。';
  document.getElementById('editModal').classList.add('show');
}

function closeModal() {
  document.getElementById('editModal').classList.remove('show');
  editingId = null;
}

function val(id) {
  return document.getElementById(id).value.trim();
}

async function save() {
  const body = {
    title: val('f-title'),
    author: val('f-author'),
    city: val('f-city'),
    likeCount: parseInt(val('f-likeCount') || '0', 10),
    coverAspectRatio: parseFloat(val('f-coverAspectRatio') || '1'),
    coverUrl: val('f-coverUrl'),
    coverAuthor: val('f-coverAuthor'),
    content: document.getElementById('f-content').value,
    status: 1
  };
  // 前端先挡一次，少一次往返；真正的校验在服务端
  if (!body.title) { Shell.toast('请填标题', false); return; }
  if (!body.author) { Shell.toast('请填作者', false); return; }
  if (!body.city) { Shell.toast('请填城市', false); return; }

  const btn = document.getElementById('btnSave');
  btn.disabled = true;
  try {
    if (editingId) {
      await Shell.api('/api/v1/admin/feed/' + editingId, { method: 'PUT', body: JSON.stringify(body) });
      Shell.toast('已保存');
    } else {
      await Shell.api('/api/v1/admin/feed', { method: 'POST', body: JSON.stringify(body) });
      Shell.toast('已新增');
    }
    closeModal();
    load();
  } catch (e) {
    Shell.toast(e.message, false);
  } finally {
    btn.disabled = false;
  }
}

/**
 * 删除（软删）：与「下线」同走 status 接口（status=0），区别是删除带二次确认
 * —— 下线是可逆的运营操作，删除语义上表示"不要了"，弹一次 confirm 防手滑。
 */
async function remove(id, current) {
  if (!confirm('确认删除该动态？删除后 App 端不再展示（可在"已下线"里重新上线）。')) return;
  try {
    await Shell.api('/api/v1/admin/feed/' + id + '/status', {
      method: 'POST',
      body: JSON.stringify({ status: 0 })
    });
    Shell.toast('已删除');
    load();
  } catch (e) {
    Shell.toast(e.message, false);
  }
}

/** 上线/下线。不做二次确认：这是一秒可逆的操作，每次都弹窗反而烦。 */
async function toggle(id, current) {
  try {
    await Shell.api('/api/v1/admin/feed/' + id + '/status', {
      method: 'POST',
      body: JSON.stringify({ status: current === 1 ? 0 : 1 })
    });
    Shell.toast(current === 1 ? '已下线' : '已上线');
    load();
  } catch (e) {
    Shell.toast(e.message, false);
  }
}
</script>
</body>
</html>
