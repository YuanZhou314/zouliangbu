<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据看板 · 走两步管理后台</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app"></div>
<script src="layout.js"></script>
<script>
Shell.mount({
  active: 'dashboard',
  title: '数据看板',
  async render(body) {
    body.innerHTML = '<div class="empty">加载中...</div>';
    let d;
    try {
      d = await Shell.api('/api/v1/admin/dashboard');
    } catch (e) {
      body.innerHTML = '<div class="empty">加载失败：' + Shell.esc(e.message) + '</div>';
      return;
    }

    // 需要运营立刻处理的项集中放上面：待审、缺图
    const alerts = [];
    if (d.submissionPending > 0) {
      alerts.push('<span class="badge warn">' + d.submissionPending + ' 条路线待审批</span>');
    }
    if (d.feedNoCover > 0) {
      alerts.push('<span class="badge warn">' + d.feedNoCover + ' 条动态缺封面</span>');
    }
    if (!alerts.length) {
      alerts.push('<span class="badge on">没有待处理事项</span>');
    }

    body.innerHTML = `
      <div class="card">
        <h2>待处理</h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap">${alerts.join('')}</div>
      </div>

      <div class="card">
        <h2>内容存量</h2>
        <div class="stats">
          <div class="stat"><div class="v">${d.feedOnline}</div><div class="k">首页动态（上线）</div></div>
          <div class="stat"><div class="v">${d.feedOffline}</div><div class="k">首页动态（下线）</div></div>
          <div class="stat"><div class="v ${d.feedNoCover > 0 ? 'warn' : ''}">${d.feedNoCover}</div>
            <div class="k">缺封面（上线中）</div></div>
          <div class="stat"><div class="v">${d.routeOnline}</div><div class="k">线路（上线）</div></div>
          <div class="stat"><div class="v">${d.routeRecommend}</div><div class="k">推荐位线路</div></div>
          <div class="stat"><div class="v">${d.routeOffline}</div><div class="k">线路（已下架）</div></div>
        </div>
      </div>

      <div class="card">
        <h2>审核队列</h2>
        <div class="stats">
          <div class="stat"><div class="v ${d.submissionPending > 0 ? 'warn' : ''}">${d.submissionPending}</div>
            <div class="k">待审批</div></div>
          <div class="stat"><div class="v">${d.submissionApproved}</div><div class="k">已通过</div></div>
          <div class="stat"><div class="v">${d.submissionRejected}</div><div class="k">已驳回</div></div>
        </div>
      </div>

      <div class="card">
        <h2>最近操作</h2>
        ${d.recentAudit && d.recentAudit.length ? `
          <table>
            <thead><tr><th style="width:170px">时间</th><th style="width:150px">动作</th><th>内容</th></tr></thead>
            <tbody>
              ${d.recentAudit.map(a => `
                <tr>
                  <td class="mono">${Shell.esc(a.createdAt.replace('T', ' ').slice(0, 19))}</td>
                  <td><span class="badge off">${Shell.esc(a.action)}</span></td>
                  <td class="wrap">${Shell.esc(a.detail || '')}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        ` : '<div class="empty">暂无操作记录</div>'}
      </div>
    `;
  }
});
</script>
</body>
</html>
