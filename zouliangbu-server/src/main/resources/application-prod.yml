# prod：MySQL 8。所有敏感项走环境变量，不落库不进 git。
# 以后换 PostgreSQL：改 url/driver，并新增 db/migration/postgres 目录后把 locations 指过去。
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://127.0.0.1:3306/zouliangbu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DATABASE_USER:zlb}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    locations: classpath:db/migration/mysql,classpath:db/migration/common

# 气象代理：和风 JWT 凭据，生产必须用环境变量提供，不给默认值。
zlb:
  weather:
    qweather-host: ${QWEATHER_HOST:https://api.qweather.com/v7}
    qweather-project-id: ${QWEATHER_PROJECT_ID:}
    qweather-credential-id: ${QWEATHER_CREDENTIAL_ID:}
    qweather-dev-id: ${QWEATHER_DEV_ID:}
    qweather-private-key: ${QWEATHER_PRIVATE_KEY:}
    cache-ttl-sec: 600
    nowcast-cache-ttl-sec: 300

logging:
  level:
    root: INFO
    com.zouliangbu.server: INFO
