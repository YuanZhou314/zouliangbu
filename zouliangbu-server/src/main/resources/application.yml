server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: zouliangbu-server
  profiles:
    active: dev          # 本地默认 dev（SQLite 单文件库，零依赖启动）；生产用 --spring.profiles.active=prod
  flyway:
    enabled: true
    # locations 按方言在 profile 里指定（dev/test → db/migration/sqlite，prod → db/migration/mysql）
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

admin:
  password: zouliangbu-admin
  token-ttl-hours: 2

logging:
  level:
    root: INFO
    com.zouliangbu.server: DEBUG
