server:
  port: 8080
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
    min-response-size: 1024

spring:
  application:
    name: zouliangbu-server
  profiles:
    active: dev          # 本地默认 dev（SQLite 单文件库，零依赖启动）；生产用 --spring.profiles.active=prod
  flyway:
    enabled: true
    # locations 按方言在 profile 里指定（dev/test → db/migration/sqlite，prod → db/migration/mysql）
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 6MB       # 略大于控制器里的 5MB 上限，让超限走我们自己的中文提示而不是 Tomcat 的 500
      max-request-size: 8MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

admin:
  password: admin        # 单账号固定密码；生产务必用 ADMIN__PASSWORD 环境变量覆盖
  token-ttl-hours: 2

zlb:
  auth:
    jwt-secret: ${ZLB_JWT_SECRET:dev-only-secret-change-me}   # 生产必须覆盖，否则 token 可被伪造
    token-ttl-days: 30
  upload:
    dir: ./uploads            # 图片落盘目录（相对启动目录），可用 ADMIN__UPLOAD__DIR 覆盖
    public-prefix: /uploads    # 对外访问前缀，App / 后台拿到的 coverUrl 形如 /uploads/2026-10/xxx.jpg

logging:
  level:
    root: INFO
    com.zouliangbu.server: DEBUG
